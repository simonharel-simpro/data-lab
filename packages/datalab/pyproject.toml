[project]
name = "datalab"
version = "0.1.0"
description = "Shared data-lab helpers: project identity, naming, settings, MLflow tracking, project scaffolding."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings~=2.16",
    "pyyaml~=6.0",
    "weaviate-client==4.24.1", # same version as Demo-RAG's uv.lock
    "mlflow==3.17.2",          # same version as the compose server image
    "httpx~=0.28",
]

[project.scripts]
datalab-new = "datalab.new_project:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyright>=1.1.390",
    "ruff==0.17.3",
    "pip-audit>=2.10.1",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalab"]

[tool.importlinter]
root_package = "datalab"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "pure modules stay pure (no weaviate/mlflow)"
type = "forbidden"
source_modules = [
    "datalab.project",
    "datalab.split",
    "datalab.ledger_model",
    "datalab.ledger_rules",
    "datalab.ledger_access",
    "datalab.ledger_ops",
    "datalab.ledger_checks",
    "datalab.ledger",
    "datalab.tags",
]
forbidden_modules = ["weaviate", "mlflow"]

[tool.ruff]
extend = "../../ruff.toml"   # single source: the repo-root config

[tool.ruff.lint]
extend-select = ["S"]        # already selected at the root; restated so the gate sees the bandit-equivalent rules

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the live data-lab stack or uv + a populated cache",
    "scaffold: scaffolds a project with a real uv lock (network); the CI checks job runs it",
]
addopts = "-ra --strict-markers -m 'not integration and not scaffold'"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
