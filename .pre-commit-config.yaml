exclude: ^tools/weavit-ui/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: file-size
        name: src modules <= 200 lines
        # No root uv project exists, so the hook runs the stdlib-only script directly.
        entry: python tools/check_file_size.py
        language: python
        files: ^(packages|projects)/[^/]+/src/.*\.py$
