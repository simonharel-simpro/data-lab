default_install_hook_types: [pre-commit, pre-push]
exclude: ^tools/weavit-ui/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  # keep in sync with the gitleaks release URL in .github/workflows/ci.yml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # CI: this hook scans staged files only; ci.yml runs a full-history scan
      - id: gitleaks
  - repo: local
    hooks:
      - id: file-size
        name: src modules <= 200 lines
        # No root uv project exists, so the hook runs the stdlib-only script directly.
        entry: python tools/check_file_size.py
        language: python
        files: ^(packages|projects)/[^/]+/src/.*\.py$
      - id: declared-deps
        name: datalab imports are declared dependencies
        # Vendored recipe (tools/pre_commit_checks). It reads pyproject.toml/uv.lock and scans src/ relative to the
        # cwd, hence --directory; it must run in the package env so import->dist mapping is authoritative;
        # --locked fails on lock drift instead of rewriting uv.lock mid-hook.
        entry: uv run --locked --directory packages/datalab python ../../tools/pre_commit_checks/check_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(packages/datalab/|tools/pre_commit_checks/)
      # >>> datalab-new: declared-deps
      - id: declared-deps-mini-rag
        name: mini-rag imports are declared dependencies
        # Same recipe and flags as declared-deps above, run in the pilot's own env.
        entry: uv run --locked --directory projects/mini-rag python ../../tools/pre_commit_checks/check_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(projects/mini-rag/|tools/pre_commit_checks/)
      - id: declared-deps-voice-arch
        name: voice-arch imports are declared dependencies
        entry: uv run --locked --directory projects/voice-arch python ../../tools/pre_commit_checks/check_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(projects/voice-arch/|tools/pre_commit_checks/)
      # <<< datalab-new: declared-deps
      - id: hydra-gate
        name: Hydra is wired in projects with configs/
        entry: python tools/pre_commit_checks/hydra_gate.py
        language: python
        files: ^projects/[^/]+/(configs/|src/|pyproject\.toml)
      - id: ledger
        name: run.json / split.json are valid experiment ledgers
        # --project keeps the repo-root cwd, so pre-commit's relative file names resolve (--directory would not).
        entry: uv run --locked --project packages/datalab python -m datalab.ledger validate
        language: system
        files: ^projects/[^/]+/(run|split)\.json$
      # Pre-push parity with ci.yml's gates + tests. pip-audit, npm audit and the gitleaks history scan stay CI-only
      # because they need the network.
      - id: gates-datalab
        name: datalab gates (contracts, types) + unit tests + coverage floor
        entry: bash -c 'cd packages/datalab && uv run --locked lint-imports && uv run --locked pyright && uv run --locked pytest -q --cov=datalab'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(packages/datalab/|contracts/|tools/|projects/[^/]+/pyproject\.toml$|\.pre-commit-config\.yaml$|\.github/workflows/ci\.yml$|app/src/lib/card\.ts$)
      # >>> datalab-new: gates
      - id: gates-mini-rag
        name: mini-rag gates (contracts, types) + unit tests + coverage floor
        entry: bash -c 'cd projects/mini-rag && uv run --locked lint-imports && uv run --locked pyright && uv run --locked pytest -q --cov'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(projects/mini-rag/|packages/datalab/src/)
      - id: gates-voice-arch
        name: voice-arch gates (contracts, types) + unit tests + coverage floor
        entry: bash -c 'cd projects/voice-arch && uv run --locked lint-imports && uv run --locked pyright && uv run --locked pytest -q --cov'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(projects/voice-arch/|packages/datalab/src/)
      # <<< datalab-new: gates
      - id: gates-app
        name: app astro check + unit tests + coverage floor
        # Needs node >=22.22 on PATH (see .nvmrc); node 20 rejects --test-coverage-lines.
        entry: bash -c 'cd app && npm run check && npm test'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(app/|contracts/|\.env\.example$)
