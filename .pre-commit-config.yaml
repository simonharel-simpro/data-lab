exclude: ^tools/weavit-ui/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: file-size
        name: src modules <= 200 lines
        # No root uv project exists, so the hook runs the stdlib-only script directly.
        entry: python tools/check_file_size.py
        language: python
        files: ^(packages|projects)/[^/]+/src/.*\.py$
      - id: declared-deps
        name: datalab imports are declared dependencies
        # Vendored recipe (tools/pre_commit_checks). It reads pyproject.toml/uv.lock and scans src/ relative to the
        # cwd, hence --directory; it must run in the package env so import->dist mapping is authoritative;
        # --locked fails on lock drift instead of rewriting uv.lock mid-hook.
        entry: uv run --locked --directory packages/datalab python ../../tools/pre_commit_checks/check_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(packages/datalab/|tools/pre_commit_checks/)
      - id: declared-deps-mini-rag
        name: mini-rag imports are declared dependencies
        # Same recipe and flags as declared-deps above, run in the pilot's own env.
        entry: uv run --locked --directory projects/mini-rag python ../../tools/pre_commit_checks/check_declared_dependencies.py
        language: system
        pass_filenames: false
        files: ^(projects/mini-rag/|tools/pre_commit_checks/)
