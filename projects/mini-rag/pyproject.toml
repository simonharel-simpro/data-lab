[project]
# "proj-" prefix: a project named like a dependency (e.g. mlflow) must not shadow it in `uv sync` (G-12).
name = "proj-mini-rag"
version = "0.1.0"
requires-python = ">=3.12"
# Every package the pilot imports directly (declared-deps hook); versions as datalab's / Demo-RAG's locks.
dependencies = [
    "datalab",
    "anthropic==2.3.0",        # LLM via the Anthropic Messages API (OpenRouter or the DGX)
    "httpx2==2.16.0",          # anthropic 2.3's HTTP client; tests use its MockTransport
    "weaviate-client==4.24.1",
    "mlflow==3.17.2",
    "pydantic-settings~=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyright>=1.1.390",
    "ruff==0.17.3",
    "pip-audit>=2.10.1",
    "pyyaml>=6.0",             # the EMBEDDER/compose guard test parses compose.yaml
    "import-linter>=2.15",
]

# A build system makes src/<pkg> importable (without one uv treats the project as virtual).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# dev-mode-dirs: the editable .pth points at src/ even while it only holds .gitkeep, so a package added after
# the first `uv sync` is importable without a reinstall.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv.sources]
datalab = { path = "../../packages/datalab", editable = true }

[tool.importlinter]
root_package = "mini_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "scoring stays pure (no I/O clients)"
type = "forbidden"
source_modules = ["mini_rag.scoring"]
forbidden_modules = ["weaviate", "mlflow", "anthropic", "httpx2", "datalab"]

[tool.ruff]
extend = "../../ruff.toml"   # single source: the repo-root config

[tool.ruff.lint]
extend-select = ["S"]        # already selected at the root; restated so the gate sees the bandit-equivalent rules

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the live data-lab stack (docker compose up -d)"]
addopts = "-ra --strict-markers -m 'not integration'"

[tool.coverage.run]
branch = true
source = ["mini_rag"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
