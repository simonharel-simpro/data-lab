[project]
# "proj-" prefix: a project named like a dependency (e.g. mlflow) must not shadow it in `uv sync` (G-12).
name = "proj-__DATALAB_PROJECT__"
version = "0.1.0"
requires-python = ">=3.12"
# omegaconf 2.4.0 is the newest, but hydra-core 1.3.8 requires omegaconf<2.4,>=2.2; mlflow as datalab's.
dependencies = ["datalab", "hydra-core==1.3.8", "omegaconf==2.3.1", "mlflow==3.17.2"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pyright==1.1.414",
    "ruff==0.17.3",
    "pip-audit==2.10.1",
    "import-linter==2.16",
]

# A build system makes src/<pkg> importable (without one uv treats the project as virtual).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# dev-mode-dirs: the editable .pth points at src/ even while it only holds the package, so a package added after
# the first `uv sync` is importable without a reinstall.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv.sources]
datalab = { path = "../../packages/datalab", editable = true }

[tool.importlinter]
root_package = "__DATALAB_PACKAGE__"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "scoring, candidates, grid stay pure"
type = "forbidden"
source_modules = [
    "__DATALAB_PACKAGE__.scoring",
    "__DATALAB_PACKAGE__.candidates",
    "__DATALAB_PACKAGE__.grid",
]
forbidden_modules = ["mlflow", "datalab", "hydra", "omegaconf"]

[tool.ruff]
extend = "../../ruff.toml"   # single source: the repo-root config

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the live data-lab stack (docker compose up -d)"]
addopts = "-ra --strict-markers -m 'not integration'"

[tool.coverage.run]
branch = true
source = ["__DATALAB_PACKAGE__"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
