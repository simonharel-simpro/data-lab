# CI-parity: the same checks as the local pre-commit/pre-push hooks. Each phase appends its own job (2B: app, 3: pilot).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the Weavit fork is not needed for the Python checks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: pre-commit (ruff, gitleaks, file size, declared deps)
        run: uvx pre-commit run --all-files
      - name: root compose test
        run: uvx pytest tests/
      - name: datalab unit tests + coverage floor
        working-directory: packages/datalab
        run: uv sync && uv run pytest --cov=datalab
