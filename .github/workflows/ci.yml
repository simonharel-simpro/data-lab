# CI runs every gate: the pre-commit-stage hooks, a full-history gitleaks scan, pip-audit, npm audit and the gates + tests
# per tree. The local pre-push hooks (.pre-commit-config.yaml) mirror the gates + tests but not the networked scans.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the Weavit fork is not needed for the Python checks
          fetch-depth: 0 # the secrets scan walks the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: pre-commit (ruff, gitleaks, file size, declared deps)
        run: uvx pre-commit run --all-files
      - name: secrets scan (whole history; the pre-commit hook only sees staged files)
        run: |
          # keep in sync with .pre-commit-config.yaml gitleaks rev
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: root compose test
        run: uvx pytest tests/
      - name: datalab gates + unit tests + coverage floor
        working-directory: packages/datalab
        run: |
          uv sync --locked
          uv run --locked lint-imports
          uv run --locked pyright
          uv run --locked pip-audit
          uv run --locked pytest --cov=datalab

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # No MLflow in CI: cards with a metric render "unavailable"; DATALAB_STRICT_EXPORT stays unset on purpose.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: astro check
        run: npm run check
      - name: unit tests + line coverage floor (70 %)
        run: npm test
      - name: build with the real projects/ (zero projects is valid, F-15)
        run: npm run build
      - name: BOM + CRLF card builds (F-11, G-9)
        run: npm run build
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/crlf-bom
      - name: name != folder fails the build (S-9, D-13)
        run: "! npm run build"
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/bad-name

  pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mini-rag
    # Unit tests only: no Weaviate, MLflow (sqlite in tmp) or LLM endpoint in CI; integration tests are marked and deselected.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: mini-rag gates (contracts, types, deps) + unit tests + coverage floor
        run: |
          uv sync --locked
          uv run --locked lint-imports
          uv run --locked pyright
          uv run --locked pip-audit
          uv run --locked pytest --cov

  voice-arch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/voice-arch
    # Unit tests only: no LiveKit, MLflow (sqlite in tmp) or OpenRouter in CI; integration tests are marked and deselected.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: voice-arch gates (contracts, types, deps) + unit tests + coverage floor
        run: |
          uv sync --locked
          uv run --locked lint-imports
          uv run --locked pyright
          uv run --locked pip-audit
          uv run --locked pytest --cov
