# CI runs every gate: the pre-commit-stage hooks, a full-history gitleaks scan, pip-audit, npm audit and the gates + tests
# per tree. The local pre-push hooks (.pre-commit-config.yaml) mirror the gates + tests but not the networked scans.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # the Weavit fork is not needed for the Python checks
          fetch-depth: 0 # the secrets scan walks the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: pre-commit (ruff, gitleaks, file size, declared deps)
        run: uvx pre-commit run --all-files
      - name: secrets scan (whole history; the pre-commit hook only sees staged files)
        run: |
          # keep in sync with .pre-commit-config.yaml gitleaks rev
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
      - name: 'root tree (tools/ + tests/): types, tests, coverage floor (#7: no root uv project)'
        run: uvx pre-commit run gates-root --hook-stage pre-push --all-files
      - name: datalab gates + unit tests + coverage floor
        working-directory: packages/datalab
        run: |
          uv sync --locked
          uv run --locked lint-imports
          # -p: the root pyrightconfig.json would otherwise win config discovery and skip this tree (#14)
          uv run --locked pyright -p pyproject.toml
          uv run --locked pip-audit
          uv run --locked pytest --cov=datalab
      - name: scaffold a fresh project and run its gates (F-3; network for uv lock)
        working-directory: packages/datalab
        run: uv run --locked pytest -m scaffold -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # No MLflow in CI: cards with a metric render "unavailable"; DATALAB_STRICT_EXPORT stays unset on purpose.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: astro check
        run: npm run check
      - name: unit tests + line coverage floor (70 %)
        run: npm test
      - name: build with the real projects/ (zero projects is valid, F-15)
        run: npm run build
      - name: BOM + CRLF card builds (F-11, G-9)
        run: npm run build
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/crlf-bom
      - name: name != folder fails the build (S-9, D-13)
        run: "! npm run build"
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/bad-name
      - name: ledger fixtures build (valid + invalid run.json, F-20)
        run: |
          npm run build
          grep -q 'class="stepper"' dist/projects/valid/index.html && grep -q 'unsupported schema (kind missing)' dist/projects/invalid/index.html
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/ledger
      - name: invalid run.json fails a strict export (F-20)
        run: "! npm run build"
        env:
          DATALAB_PROJECTS_DIR: test-fixtures/ledger
          DATALAB_STRICT_EXPORT: "1"

  projects:
    name: project (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          # >>> datalab-new: matrix
          - mini-rag
          - voice-arch
          # <<< datalab-new: matrix
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    # Unit tests only: no Weaviate, LiveKit, MLflow server or LLM endpoint in CI; integration tests are deselected.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: gates (contracts, types, deps) + unit tests + coverage floor
        run: |
          uv sync --locked
          uv run --locked lint-imports
          # -p: the root pyrightconfig.json would otherwise win config discovery and skip this tree (#14)
          uv run --locked pyright -p pyproject.toml
          uv run --locked pip-audit
          uv run --locked pytest --cov
      - name: Hydra gate (skips a project without configs/)
        working-directory: .
        run: python tools/pre_commit_checks/hydra_gate.py projects/${{ matrix.project }}
      - name: experiment ledger (run.json / split.json; ok when neither exists)
        working-directory: .
        run: uv run --locked --project packages/datalab python -m datalab.ledger validate projects/${{ matrix.project }}
