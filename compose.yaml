# data-lab shared infra: one Weaviate (+ vectorizer) and one MLflow for every project under projects/.
#
# SECURITY: every service is unauthenticated, so every published port binds to 127.0.0.1 only — never 0.0.0.0.
# Auth + HTTPS are deferred until any non-local exposure (issue #2).
#
# Ports 8090 / 50052 / 5050 (not 8080 / 50051 / 5000) so Demo-RAG's stack keeps running side by side (D-4).
#
# LiveKit (voice-arch) is opt-in: ports 7880 (HTTP/WS) / 7881 (TCP) / 7882 (UDP), started with
# `docker compose --profile voice up -d` (a plain `docker compose up -d` does not start it).
#
# WARNING: `docker compose down -v` deletes the named volumes, i.e. the Weaviate collections and MLflow runs of
# EVERY project. Use plain `docker compose down` to stop the stack.
name: data-lab

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.2
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      # Collections opt in to the vectorizer; bring-your-own-vectors stays possible.
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://t2v-transformers:8080"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:50052:50051"
    depends_on:
      t2v-transformers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # The HNSW commit log is buffered: a hard kill (Docker's default 10 s) once left both MiniRag
    # indexes empty while the objects survived (2026-11-07). Give Weaviate time to flush on stop.
    stop_grace_period: 60s

  t2v-transformers:
    # English-only model, pinned (D-5); multilingual tracked in #6. No host port: only Weaviate calls it.
    image: semitechnologies/transformers-inference:baai-bge-small-en-v1.5-1.13.3
    environment:
      ENABLE_CUDA: "0"
    healthcheck:
      # Python, not wget/curl: the slim inference image does not ship them.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/.well-known/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  livekit:
    # Profile `voice`: not started by the default `docker compose up -d` (D-19).
    image: livekit/livekit-server:v1.13.10
    profiles: [voice]
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # `:-`, never `:?`: interpolation runs for every service, so `:?` would break every compose command without
      # the keys. The server itself refuses empty keys at start.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      # The image ships busybox (wget applet, no curl); the server answers 200 "OK" on its HTTP port.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  weaviate_data:
  mlflow_data:
